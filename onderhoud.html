<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173b3f">
<title>Al-Manārah · Binnenkort beschikbaar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --card: #faf7f2;
    --text: #1a2e30;
    --muted: #6b7a7c;
    --brown: #173b3f;
    --gold: #bf9d56;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid #e5ddd0;
    border-radius: 20px;
    padding: 48px 36px;
    text-align: center;
    box-shadow: 0 12px 40px -24px rgba(23, 59, 63, 0.25);
  }
  .mark {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--brown);
    color: var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Amiri, serif;
    font-size: 28px;
    font-weight: 700;
  }
  .ar {
    font-family: Amiri, serif;
    font-size: 22px;
    color: var(--gold);
    margin-bottom: 8px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--muted);
    margin-bottom: 28px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    background: #e8f0ef;
    color: var(--brown);
    font-size: 13px;
    font-weight: 600;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gold);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.85); }
  }
  footer {
    margin-top: 28px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">م</div>
    <div class="ar">المنارة</div>
    <h1>We zijn even bezig</h1>
    <p>
      Er wordt gewerkt aan een update van Al-Wājibāt.
      De studieomgeving is binnenkort weer beschikbaar.
    </p>
    <div class="badge">
      <span class="dot" aria-hidden="true"></span>
      Update volgt binnenkort
    </div>
    <footer>Al-Manārah · Al-Wājibāt</footer>
  </main>
</body>
</html>
